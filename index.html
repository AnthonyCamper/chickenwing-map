<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport — viewport-fit=cover for notch/Dynamic Island support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Favicon & icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme & app colours -->
    <meta name="theme-color" content="#0d122a" />
    <meta name="msapplication-TileColor" content="#fa5a2e" />

    <!-- ── iOS home-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WingKingTony" />

    <!-- ── SEO & Open Graph -->
    <meta name="description" content="WingKingTony — the digital home of wing culture. Crawls, rankings, sauce debates, and city scenes." />
    <meta property="og:title" content="WingKingTony" />
    <meta property="og:description" content="The digital home of wing culture. Crawls, rankings, sauce debates, and city scenes." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── Fonts: Anton (athletic display) + Permanent Marker (hand) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <title>WingKingTony — the digital home of wing culture</title>

    <!-- Old GitHub Pages SPA redirect: links of the form /?p=/spots/x (from
         the previous 404.html, which bounced every deep link through here)
         may still be bookmarked or shared. Restores the real URL before
         React Router mounts. Deep links no longer need it: the build now
         ships 404.html as a copy of this page (scripts/pages-spa-fallback.mjs). -->
    <script>
      (function () {
        var l = window.location;
        if (l.search.indexOf('?p=/') === 0 || l.search.indexOf('&p=/') !== -1) {
          var q = l.search.slice(1).split('&').reduce(function (acc, kv) {
            var i = kv.indexOf('=');
            var k = i === -1 ? kv : kv.slice(0, i);
            var v = i === -1 ? '' : kv.slice(i + 1);
            acc[k] = v;
            return acc;
          }, {});
          if (q.p !== undefined) {
            var target = decodeURIComponent(q.p);
            delete q.p;
            var rest = Object.keys(q).map(function (k) {
              return q[k] ? k + '=' + q[k] : k;
            }).join('&');
            var newSearch = target.indexOf('?') === -1
              ? (rest ? '?' + rest : '')
              : (rest ? '&' + rest : '');
            window.history.replaceState(
              null, null,
              target.replace(/~and~/g, '&') + newSearch + l.hash
            );
          }
        }
      })();
      // GitHub Pages serves the per-route copies (dist/login/index.html) at
      // "/login/" — it redirects "/login" there. Drop the trailing slash so
      // the router and every path check see "/login".
      (function () {
        var l = window.location;
        if (l.pathname.length > 1 && l.pathname.charAt(l.pathname.length - 1) === '/') {
          window.history.replaceState(null, '', (l.pathname.replace(/\/+$/, '') || '/') + l.search + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static first-paint shell: shown until React mounts and replaces it,
           so slow connections see the brand instead of a blank screen. -->
      <div style="min-height:100vh;min-height:100dvh;background:#0d122a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,-apple-system,sans-serif">
        <img src="/favicon.svg" alt="" width="64" height="64" style="border-radius:16px" />
        <p style="color:#fdfaf2;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0">Loading WingKingTony…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
